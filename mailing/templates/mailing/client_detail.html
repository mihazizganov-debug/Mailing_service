{% extends 'mailing/base.html' %}

{% block content %}
<div class="card">
    <div class="card-header">
        <h2>{{ client.email }}</h2>
    </div>
    <div class="card-body">
        <p><strong>Ф.И.О.:</strong> {{ client.full_name }}</p>
        <p><strong>Комментарий:</strong> {{ client.comment }}</p>
    </div>
    <div class="card-footer">
        <a href="{% url 'mailing:client_update' client.pk %}" class="btn btn-warning">Редактировать</a>
        <a href="{% url 'mailing:client_delete' client.pk %}" class="btn btn-danger">Удалить</a>
        <a href="{% url 'mailing:client_list' %}" class="btn btn-secondary">Назад</a>
    </div>
</div>
{% endblock %}
