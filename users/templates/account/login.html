{% extends 'mailing/base.html' %}
{% load i18n %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h1>{% trans "Вход" %}</h1>
        <form method="post" action="{% url 'account_login' %}">
            {% csrf_token %}
            <div class="mb-3">
                <label for="id_login" class="form-label">Email</label>
                <input type="email" name="login" class="form-control" id="id_login" required>
            </div>
            <div class="mb-3">
                <label for="id_password" class="form-label">Пароль</label>
                <input type="password" name="password" class="form-control" id="id_password" required>
            </div>
            <button type="submit" class="btn btn-primary">Войти</button>
        </form>
        <p class="mt-3">
            <a href="{% url 'account_reset_password' %}">Забыли пароль?</a>
        </p>
        <p class="mt-3">Нет аккаунта? <a href="{% url 'account_signup' %}">Зарегистрироваться</a></p>
    </div>
</div>
{% endblock %}
