{% extends 'mailing/base.html' %}
{% load i18n %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h1>{% trans "Сброс пароля" %}</h1>
        <p>Забыли пароль? Введите ваш email, и мы отправим ссылку для сброса.</p>
        <form method="post" action="{% url 'account_reset_password' %}">
            {% csrf_token %}
            <div class="mb-3">
                <label for="id_email" class="form-label">Email</label>
                <input type="email" name="email" class="form-control" id="id_email" required>
            </div>
            <button type="submit" class="btn btn-primary">Отправить</button>
        </form>
        <p class="mt-3"><a href="{% url 'account_login' %}">Вернуться ко входу</a></p>
    </div>
</div>
{% endblock %}
