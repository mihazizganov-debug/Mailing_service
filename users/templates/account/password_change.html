{% extends 'mailing/base.html' %}
{% load i18n %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h1>{% trans "Смена пароля" %}</h1>
        <form method="post" action="{% url 'account_change_password' %}">
            {% csrf_token %}
            <div class="mb-3">
                <label for="id_oldpassword" class="form-label">Старый пароль</label>
                <input type="password" name="oldpassword" class="form-control" id="id_oldpassword" required>
            </div>
            <div class="mb-3">
                <label for="id_password1" class="form-label">Новый пароль</label>
                <input type="password" name="password1" class="form-control" id="id_password1" required>
            </div>
            <div class="mb-3">
                <label for="id_password2" class="form-label">Подтверждение пароля</label>
                <input type="password" name="password2" class="form-control" id="id_password2" required>
            </div>
            <button type="submit" class="btn btn-primary">Сменить пароль</button>
        </form>
        <p class="mt-3"><a href="{% url 'mailing:home' %}">На главную</a></p>
    </div>
</div>
{% endblock %}
